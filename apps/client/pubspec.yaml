name: rs_client
description: Retro Steam client (Steam Big Picture style).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: '>=3.47.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  http: ^1.6.0
  rs_api_client:
    path: ../../packages/rs_api_client
  rs_core:
    path: ../../packages/rs_core
  rs_theme:
    path: ../../packages/rs_theme
  rs_ui:
    path: ../../packages/rs_ui
  rs_ui_steam:
    path: ../../packages/rs_ui_steam
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
