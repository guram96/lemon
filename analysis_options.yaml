# Shared analyzer config for every package in the workspace.
# Packages inherit this file automatically (nearest analysis_options.yaml up the tree).
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/build/**"
    - "apps/client/android/**"
    - "apps/client/ios/**"
    - "apps/client/linux/**"
    - "apps/client/macos/**"
    - "apps/client/windows/**"
    - "apps/client/web/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - cancel_subscriptions
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - unawaited_futures
    - unnecessary_lambdas
    - use_key_in_widget_constructors
    - use_super_parameters
